# Build the production Flatpak for every push and PR, on both
# architectures Silverblue ships on. Uses the canonical
# flatpak/flatpak-github-actions builder; sources are fully offline
# (cargo-sources.json), so the build proves the vendor list too.
name: Flatpak

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flatpak:
    name: Flatpak (${{ matrix.arch }})
    # Native runners: ubuntu-24.04 for x86_64, ubuntu-24.04-arm for aarch64
    # (free for public repositories). The builder image is a multi-arch
    # index, so the container pulls the runner's own architecture.
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
      # One architecture failing should not hide the other's result.
      fail-fast: false
    steps:
      # Actions are pinned to commits, with the tag they were pinned from
      # beside them: a tag can be moved, a commit cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          bundle: taste-${{ matrix.arch }}.flatpak
          manifest-path: build-aux/flatpak/net.davidstrauss.Taste.json
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('build-aux/flatpak/*.json', 'Cargo.lock') }}
          arch: ${{ matrix.arch }}
