[package]
name = "taste-acp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
taste-authproxy.workspace = true
taste-core.workspace = true
taste-git.workspace = true
# unstable_end_turn_token_usage: the utilization display needs per-turn
# Usage; re-evaluate when it stabilizes.
agent-client-protocol = { version = "2", features = ["unstable_end_turn_token_usage", "unstable_auth_methods"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-channel.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
# The relocation test proves the environment channel end to end, so it needs
# both ends of it: the supervisor side that opens one, and the IDE servers
# that answer down it. Dev-only, and no cycle — neither crate knows this one.
taste-devcontainer.workspace = true
taste-flatpak.workspace = true
taste-mcp.workspace = true
git2.workspace = true
# The relocation test stands up a mock upstream so the live auth chain can
# be exercised without spending a token.
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
