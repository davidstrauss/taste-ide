[package]
name = "taste-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "taste-ide"
path = "src/main.rs"

[dependencies]
taste-core.workspace = true
taste-acp.workspace = true
taste-git.workspace = true
taste-devcontainer.workspace = true
taste-flatpak.workspace = true
taste-fleetlink.workspace = true
taste-mcp.workspace = true

agent-client-protocol = "2"
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
sourceview5 = "0.11"
vte4 = { version = "0.10", features = ["v0_70"] }

anyhow.workspace = true
notify.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-channel.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ec4rs.workspace = true
ignore.workspace = true
pulldown-cmark.workspace = true
base64.workspace = true
similar.workspace = true
