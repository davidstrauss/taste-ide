[package]
name = "taste-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "taste-ide"
path = "src/main.rs"

[dependencies]
taste-core.workspace = true
taste-acp.workspace = true
taste-git.workspace = true
taste-devcontainer.workspace = true
taste-flatpak.workspace = true
taste-fleetlink.workspace = true
taste-mcp.workspace = true
taste-voice.workspace = true
taste-models.workspace = true
taste-semantic.workspace = true

agent-client-protocol = "2"
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
sourceview5 = "0.11"
# v0_72 for vte_terminal_get_text_range_format: the console's search
# reads scrollback through it (console.rs).
vte4 = { version = "0.10", features = ["v0_72"] }
# The port tab's browser face. WebKitGTK 6 is in the GNOME runtime.
webkit6 = "0.6"

anyhow.workspace = true
notify.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-channel.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ec4rs.workspace = true
ignore.workspace = true
pulldown-cmark.workspace = true
base64.workspace = true
similar.workspace = true
# The port tab's REST client: loopback HTTP/1.1 through the same client
# stack the auth proxy uses.
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
http.workspace = true
bytes.workspace = true
