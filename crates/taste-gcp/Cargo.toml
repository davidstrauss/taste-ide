[package]
name = "taste-gcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# `rest::TokenSource::fixed`, a token that never lapses, for other crates'
# tests against a mock of Google's APIs.
testing = []

[dependencies]
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
# Unpacking the pinned gcloud archive in-process, so nothing depends on
# the Flatpak runtime shipping a `tar`.
flate2 = "1"
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tar = "0.4"
taste-models.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile = "3"
