[package]
name = "taste-diagram"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The IDE's diagram helper: Mermaid drawn in a confined process"

[[bin]]
name = "taste-diagram"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
# Mermaid, natively: merman lays a diagram out and writes SVG — the
# implementation Zed embeds — and resvg draws it. ELK layout is left out
# (its EPL-2.0 notices travel with any build that compiles it); harfrust
# shapes the text the layout measures and skrifa reads the font's metrics,
# each at the version usvg uses for the same, so a label is measured as it
# will be drawn.
# All of it runs here and never in the IDE: it parses text a repository
# or an agent wrote, and this process is confined (taste-confine).
merman = { version = "=0.9.3", default-features = false, features = ["all-diagrams", "svg"] }
# `raster-images`: resvg's own decoders (PNG through tiny-skia, JPEG
# through zune-jpeg, GIF, WebP), all memory-safe Rust, for a notebook's
# pictures — each wrapped as the one image of an SVG, so they are decoded
# here, confined, and never by libpng, libjpeg, or a sniffed loader in the
# IDE (taste-app's mermaid.rs, `figure`).
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
harfrust = "0.12"
skrifa = { version = "0.44", features = ["std"] }

[dev-dependencies]
taste-confine.workspace = true
base64.workspace = true
