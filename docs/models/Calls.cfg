\* Calls.tla as built: the deadline counts from the read and is kept apart from the work, which keeps its permit until it is gone. Every property holds.
\* (build-aux/check-models.sh)
SPECIFICATION Spec
CONSTANTS
    Calls = {c1, c2, c3, c4}
    Permits = 2
    Workers = 3
    Deadline = 3
    MaxTime = 8
    Answerer = "apart"
    FromRead = TRUE
    SlotWithWork = TRUE
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    AnsweredInTime
    Contained
