    Calls = {c1, c2, c3, c4}
    Permits = 2
    Workers = 2
    Deadline = 3
    MaxTime = 8
    Answerer = "beside"
    FromRead = TRUE
    SlotWithWork = TRUE
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    AnsweredInTime
    Contained
