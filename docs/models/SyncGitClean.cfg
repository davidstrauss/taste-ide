\* SyncGit.tla with ProtectIgnored = TRUE and Cleanup = "old" (build-aux/check-sync-model.sh).
SPECIFICATION Spec
CONSTANTS
    Paths = {"p", "q"}
    Fresh = {"q"}
    Branches = {"main", "topic"}
    MaxValue = 4
    MaxCommits = 3
    MaxSwitches = 1
    MaxToggles = 1
    MaxCrashes = 1
    ProtectIgnored = TRUE
    Cleanup = "old"
INVARIANTS
    Safety
    NoMarkers
PROPERTY
    Converges
