SPECIFICATION Spec
CONSTANTS
    Calls = {c1, c2, c3, c4}
    Permits = 2
    Workers = 3
    Deadline = 3
    MaxTime = 8
    Answerer = "apart"
    FromRead = FALSE
    SlotWithWork = TRUE
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    AnsweredInTime
    Contained
