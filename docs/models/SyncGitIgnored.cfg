\* SyncGit.tla with ProtectIgnored = FALSE and Cleanup = "precise" (build-aux/check-sync-model.sh).
SPECIFICATION Spec
CONSTANTS
    Paths = {"p", "q"}
    Fresh = {"q"}
    Branches = {"main", "topic"}
    MaxValue = 4
    MaxCommits = 3
    MaxSwitches = 1
    MaxToggles = 1
    MaxCrashes = 1
    ProtectIgnored = FALSE
    Cleanup = "precise"
INVARIANTS
    Safety
    NoMarkers
PROPERTY
    Converges
