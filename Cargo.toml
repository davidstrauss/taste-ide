[workspace]
resolver = "2"
members = [
    "crates/taste-core",
    "crates/taste-acp",
    "crates/taste-authproxy",
    "crates/taste-git",
    "crates/taste-devcontainer",
    "crates/taste-flatpak",
    "crates/taste-mcp",
    "crates/taste-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/davidstrauss/taste-ide"

[workspace.dependencies]
taste-core = { path = "crates/taste-core" }
taste-acp = { path = "crates/taste-acp" }
taste-authproxy = { path = "crates/taste-authproxy" }
taste-git = { path = "crates/taste-git" }
taste-devcontainer = { path = "crates/taste-devcontainer" }
taste-flatpak = { path = "crates/taste-flatpak" }
taste-mcp = { path = "crates/taste-mcp" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "io-std", "sync", "macros", "net", "time", "fs", "signal"] }
async-channel = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
notify = "8"
json_comments = "0.2"
git2 = { version = "0.20", features = ["vendored-libgit2"] }
ignore = "0.4"
ec4rs = "1"
pulldown-cmark = { version = "0.13", default-features = false }
base64 = "0.22"
similar = "2"
# The auth proxy's HTTP stack. rustls, never openssl: the Flatpak runtime
# ships no openssl and vendoring one would be a C build in the middle of a
# Rust workspace. webpki roots rather than the host store, so the trust
# anchors are the same inside and outside the sandbox.
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "client", "client-legacy"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "logging", "webpki-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
getrandom = "0.4"
