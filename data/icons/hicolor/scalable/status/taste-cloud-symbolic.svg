<?xml version="1.0" encoding="UTF-8"?>
<!-- A cloud: the title bar's sync and cloud status (syncstatus.rs), whose
     state is the coloured badge drawn over its lower right, not the glyph.
     Filled shapes rather than strokes, and no mask, which GTK's symbolic
     loader does not honour. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <g fill="#241f31">
    <circle cx="7.5" cy="6.5" r="4"/>
    <circle cx="3.75" cy="9.25" r="2.75"/>
    <circle cx="11.75" cy="8.75" r="3.25"/>
    <rect x="3.75" y="8.75" width="8" height="3.25"/>
  </g>
</svg>
