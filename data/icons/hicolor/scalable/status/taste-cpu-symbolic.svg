<?xml version="1.0" encoding="UTF-8"?>
<!-- A processor, for the VM row's CPU graph: a chip with a die in it and
     two pins out of each side. The die is a hole (even-odd), so the glyph
     is one colour, as the rest of these are; the pins are short enough
     that at twelve pixels they read as a chip's edge and not as a
     centipede. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <g fill="#241f31">
    <path fill-rule="evenodd" d="M4.5 3.5 A1 1 0 0 0 3.5 4.5 V11.5 A1 1 0 0 0 4.5 12.5 H11.5 A1 1 0 0 0 12.5 11.5 V4.5 A1 1 0 0 0 11.5 3.5 Z M6 6 H10 V10 H6 Z"/>
    <path d="M5.5 1 H6.5 V3.5 H5.5 Z M9.5 1 H10.5 V3.5 H9.5 Z M5.5 12.5 H6.5 V15 H5.5 Z M9.5 12.5 H10.5 V15 H9.5 Z M1 5.5 H3.5 V6.5 H1 Z M1 9.5 H3.5 V10.5 H1 Z M12.5 5.5 H15 V6.5 H12.5 Z M12.5 9.5 H15 V10.5 H12.5 Z"/>
  </g>
</svg>
