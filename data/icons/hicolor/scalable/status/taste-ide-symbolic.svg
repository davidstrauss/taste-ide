<?xml version="1.0" encoding="UTF-8"?>
<!-- taste-ide, monochrome: the app icon's own carrot — the same four paths
     at the same -18 degree tilt — in one colour (David, 2026-09-08: "the
     carrot icon should just be the Taste IDE icon in monochrome"). The
     score marks are the body's colour here and so cannot show; the
     silhouette is the icon.

     The view box is the bounding box of the ROTATED shape, computed rather
     than eyeballed. That is the whole of what was wrong before: the crop
     was measured on the upright paths, so the tilted carrot sat off-centre
     inside it and rendered smaller than its slot. A carrot is taller than
     it is wide and stays that way here — 7.6 pixels across a 14 pixel row
     — because these are the app icon's proportions, not a glyph's. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="25.5 9.4 59.5 109.5">
  <g fill="#2e3436" transform="rotate(-18 64 68)">
    <path d="M64 46 C 50 41, 41 31, 42 16 C 55 19, 62 31, 64 46 Z"/>
    <path d="M64 46 C 78 41, 87 31, 86 16 C 73 19, 66 31, 64 46 Z"/>
    <path d="M64 48 C 58 35, 57 21, 64 8 C 71 21, 70 35, 64 48 Z"/>
    <path d="M64 120 C 53 102, 44 76, 46 52 Q 64 40, 82 52 C 84 76, 75 102, 64 120 Z"/>
  </g>
</svg>
