<?xml version="1.0" encoding="UTF-8"?>
<!-- taste-ide, monochrome: the app icon's own carrot — its four paths,
     unaltered (David, 2026-09-08: "the carrot icon should just be the
     Taste IDE icon in monochrome").

     Two things the 128px artwork needs to survive a fourteen pixel row,
     neither of which touches the shape itself.

     THE FRAME is the bounding box of the ROTATED carrot, computed rather
     than eyeballed. The old crop was measured on the upright paths, so the
     tilted carrot sat off-centre inside it and rendered smaller than its
     slot.

     THE TILT is 45 degrees here rather than the app icon's 18. A carrot is
     three times taller than it is wide, and in a square slot that height
     is the only thing that fits: at 18 degrees it rendered 7 pixels across
     against the play triangle's 10, and read as a sliver (David: "the
     Taste IDE icon is way too small on a subjective space perspective
     versus other icons"). Laid corner to corner its bounding box is square
     — 93.1 by 93.1 — so it fills the slot in both directions and carries
     the weight of the glyphs beside it.

     THE GAPS are cut by the mask. The full icon separates the three leaves
     from each other and from the body by hue; in one colour they close
     into a single lump, so a hairline is carved along each leaf's edge and
     along the body's crown. The negative space is what says "carrot" here
     — it is doing the job the greens do in the original. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="9.7 13.7 93.1 93.1">
  <defs>
    <mask id="leaf-gaps" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="5" stroke-linecap="round">
        <path d="M64 48 C 58 35, 57 21, 64 8"/>
        <path d="M64 48 C 70 35, 71 21, 64 8"/>
        <path d="M46 52 Q 64 40, 82 52"/>
      </g>
    </mask>
  </defs>
  <g transform="rotate(-45 64 68)">
    <g fill="#241f31" mask="url(#leaf-gaps)">
      <path d="M64 46 C 50 41, 41 31, 42 16 C 55 19, 62 31, 64 46 Z"/>
      <path d="M64 46 C 78 41, 87 31, 86 16 C 73 19, 66 31, 64 46 Z"/>
      <path d="M64 48 C 58 35, 57 21, 64 8 C 71 21, 70 35, 64 48 Z"/>
      <path d="M64 120 C 53 102, 44 76, 46 52 Q 64 40, 82 52 C 84 76, 75 102, 64 120 Z"/>
    </g>
  </g>
</svg>
