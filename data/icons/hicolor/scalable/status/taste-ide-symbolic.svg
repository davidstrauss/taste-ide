<?xml version="1.0" encoding="UTF-8"?>
<!-- taste-ide, monochrome: the app icon's carrot — a three-frond fan over
     a tapered body, at the same -18 degree tilt — redrawn at 16 pixels
     rather than cropped down to them (David, 2026-09-08: "the actual app
     icon, just monochrome").

     Cropping the 128px artwork did not work twice over. Its view box was
     measured on the UNROTATED shape, so the tilted carrot drifted out of
     frame and came out a sliver in the corner. And the artwork's own
     proportions are a real carrot's — 36 units wide against 80 tall —
     which at this size is five pixels of width beside a play triangle's
     ten. So the body here is stubbier than the app icon's, the fronds are
     spread until there is daylight between them (in one colour the gaps
     are what say "carrot"; the full icon separates the leaves by hue), and
     the shape is sized so that the TILTED result fills the slot. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <g fill="#2e3436" transform="rotate(-18 8 8)">
    <path d="M7.0 6.4 C 4.3 6.0, 2.7 4.3, 2.6 2.0 C 5.9 2.2, 7.2 4.0, 7.0 6.4 Z"/>
    <path d="M9.0 6.4 C 11.7 6.0, 13.3 4.3, 13.4 2.0 C 10.1 2.2, 8.8 4.0, 9.0 6.4 Z"/>
    <path d="M8.0 6.4 C 6.6 4.8, 6.5 2.9, 8.0 1.0 C 9.5 2.9, 9.4 4.8, 8.0 6.4 Z"/>
    <path d="M8.0 15.2 L 4.4 7.4 Q 8.0 5.6, 11.6 7.4 Z"/>
  </g>
</svg>
