<?xml version="1.0" encoding="UTF-8"?>
<!-- A port with a slash through it: the Ports section's ghost row when a
     devcontainer forwards nothing. The slash cuts a halo through the slabs
     (a mask) so it reads in one colour. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <defs>
    <mask id="halo">
      <rect width="16" height="16" fill="#fff"/>
      <path d="M13.0 0.2 L 15.8 3.0 L 3.0 15.8 L 0.2 13.0 Z" fill="#000"/>
    </mask>
  </defs>
  <g fill="#241f31">
    <g mask="url(#halo)">
      <path d="M1.5 1 H14.5 A1.5 1.5 0 0 1 16 2.5 V5.5 A1.5 1.5 0 0 1 14.5 7 H1.5 A1.5 1.5 0 0 1 0 5.5 V2.5 A1.5 1.5 0 0 1 1.5 1 Z M3 3 V5 H13 V3 Z"/>
      <path d="M1.5 9 H14.5 A1.5 1.5 0 0 1 16 10.5 V13.5 A1.5 1.5 0 0 1 14.5 15 H1.5 A1.5 1.5 0 0 1 0 13.5 V10.5 A1.5 1.5 0 0 1 1.5 9 Z M3 11 V13 H13 V11 Z"/>
    </g>
    <path d="M13.6 1.0 A0.9 0.9 0 0 1 15.0 2.4 L 2.4 15.0 A0.9 0.9 0 0 1 1.0 13.6 Z"/>
  </g>
</svg>
