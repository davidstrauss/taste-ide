<?xml version="1.0" encoding="UTF-8"?>
<!-- Empty-state illustration: an empty speech bubble with a carrot standing
     beside it, waiting to be spoken to. Same family as taste-wilted-folder
     (neutral gray furniture, the carrot keeps its brand colors) — but this
     is an invitation rather than a dead end, so the carrot is expectant
     and not sad. Everything sits inside the viewBox: a clipped carrot is
     the first thing the eye finds. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- the empty bubble: outlined rather than filled, because it is a
       conversation that has not happened yet -->
  <path fill="none" stroke="#9a9996" stroke-width="5" stroke-linejoin="round"
        d="M20 20 h62 a10 10 0 0 1 10 10 v30 a10 10 0 0 1 -10 10 H44 l-15 13 a2 2 0 0 1 -3.3 -1.6 V70 h-5.7 A10 10 0 0 1 10 60 V30 a10 10 0 0 1 10 -10 Z"/>
  <!-- nothing said in it yet -->
  <g fill="#c0bfbc">
    <circle cx="35" cy="45" r="5"/>
    <circle cx="51" cy="45" r="5"/>
    <circle cx="67" cy="45" r="5"/>
  </g>
  <!-- the carrot, standing at the corner and looking up at the bubble -->
  <g transform="translate(92 52) scale(0.8) rotate(-6)">
    <!-- leaves: up and alert -->
    <g fill="#26a269">
      <path d="M14 18 C 7 14, 1 14, -4 19 C 4 22, 10 21, 14 18 Z"/>
      <path d="M16 18 C 22 11, 30 9, 36 12 C 31 18, 23 21, 16 18 Z"/>
    </g>
    <path fill="#2ec27e" d="M15 19 C 12 12, 12 4, 16 -2 C 20 4, 19 13, 15 19 Z"/>
    <!-- body -->
    <path fill="#ff7800" d="M15 20 C 24 19, 31 24, 31 33 C 31 48, 25 66, 17 76 C 15 78, 12 78, 11 75 C 7 63, 5 46, 7 32 C 8 25, 11 21, 15 20 Z"/>
    <!-- expectant face: eyes raised toward the bubble, small smile -->
    <g fill="#7a3b00">
      <circle cx="14" cy="32" r="2.2"/>
      <circle cx="24" cy="32" r="2.2"/>
    </g>
    <path d="M14 42 C 17 45, 22 45, 25 42" stroke="#7a3b00" stroke-width="2.5"
          stroke-linecap="round" fill="none"/>
  </g>
</svg>
