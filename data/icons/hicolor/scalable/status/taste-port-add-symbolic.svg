<?xml version="1.0" encoding="UTF-8"?>
<!-- A server stack with a plus: the Ports section's ghost row, which opens
     the devcontainer to add forwardPorts — the same act as the Tasks
     ghost's document-new, so the same plus in the same corner. The lower
     slab stops short of the plus rather than being masked around it: GTK's
     symbolic loader ignores an SVG mask, and a masked halo drew as no gap
     at all. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <g fill="#241f31">
    <path d="M1.5 1 H14.5 A1.5 1.5 0 0 1 16 2.5 V5.5 A1.5 1.5 0 0 1 14.5 7 H1.5 A1.5 1.5 0 0 1 0 5.5 V2.5 A1.5 1.5 0 0 1 1.5 1 Z M3 3 V5 H13 V3 Z"/>
    <path d="M1.5 9 H7.5 V15 H1.5 A1.5 1.5 0 0 1 0 13.5 V10.5 A1.5 1.5 0 0 1 1.5 9 Z M3 11 V13 H6 V11 Z"/>
    <path d="M11.5 9 H13.5 V11.5 H16 V13.5 H13.5 V16 H11.5 V13.5 H9 V11.5 H11.5 Z"/>
  </g>
</svg>
