<?xml version="1.0" encoding="UTF-8"?>
<!-- The ghost struck through: the search's "hide non-matching items"
     toggle, which is pressed by default (David, 2026-09-08: "have the icon
     be a strike over ghosts and 'on' mean 'hide non-matching items'"). The
     slash cuts a halo through the ghost — the same mask
     taste-port-off-symbolic uses — so the two shapes stay separate in one
     colour. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <defs>
    <mask id="halo">
      <rect width="16" height="16" fill="#fff"/>
      <path d="M13.0 0.2 L 15.8 3.0 L 3.0 15.8 L 0.2 13.0 Z" fill="#000"/>
    </mask>
  </defs>
  <g fill="#241f31">
    <path mask="url(#halo)" fill-rule="evenodd" d="M8 1 C 4.7 1 2 3.7 2 7 v 7.2
      c 0 .7 .8 1 1.3 .6 L 5 13.5 l 1.7 1.3 c .4 .3 .9 .3 1.3 0 L 8 14.7 l 1.7 1.3
      -1.7 -1.3 c .4 .3 .9 .3 1.3 0 L 11 13.5 l 1.7 1.3 c .5 .4 1.3 .1 1.3 -.6 V 7
      C 14 3.7 11.3 1 8 1 Z M 6 5.5 a 1.1 1.1 0 1 1 0 2.2 a 1.1 1.1 0 0 1 0 -2.2 Z
      m 4 0 a 1.1 1.1 0 1 1 0 2.2 a 1.1 1.1 0 0 1 0 -2.2 Z"/>
    <path d="M13.6 1.0 A0.9 0.9 0 0 1 15.0 2.4 L 2.4 15.0 A0.9 0.9 0 0 1 1.0 13.6 Z"/>
  </g>
</svg>
