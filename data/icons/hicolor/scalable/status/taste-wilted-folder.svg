<?xml version="1.0" encoding="UTF-8"?>
<!-- Empty-state illustration: the carrot, wilted over an open folder.
     Folder stays neutral gray (StatusPage-style); the carrot keeps its
     brand colors as the one warm note in an empty view. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- folder back panel -->
  <path fill="#77767b" d="M18 38 a8 8 0 0 1 8 -8 h22 l9 10 h45 a8 8 0 0 1 8 8 v8 H18 Z"/>
  <!-- open front flap, slanted -->
  <path fill="#9a9996" d="M26 56 h86 a6 6 0 0 1 6 7 l-9 34 a10 10 0 0 1 -10 8 H26 a8 8 0 0 1 -8 -8 V64 a8 8 0 0 1 8 -8 Z"/>
  <!-- wilted carrot: crown hooked on the flap's top edge, body drooping
       down the front, tip curling back in defeat -->
  <g>
    <!-- drooping leaves, sagging left off the edge -->
    <g fill="#26a269">
      <path d="M64 54 C 54 50, 46 52, 40 60 C 50 62, 58 60, 64 54 Z"/>
      <path d="M66 54 C 60 46, 52 42, 43 44 C 47 53, 56 57, 66 54 Z"/>
    </g>
    <path fill="#2ec27e" d="M67 55 C 62 48, 60 40, 63 32 C 69 38, 70 47, 67 55 Z"/>
    <!-- body: bends over the edge and hangs down the flap -->
    <path fill="#ff7800" d="M66 52
      C 78 50, 88 54, 90 64
      C 92 76, 88 92, 80 102
      C 78 104, 74 103, 74 100
      C 76 90, 78 78, 74 70
      C 71 63, 68 58, 66 52 Z"/>
    <!-- score marks following the droop -->
    <g stroke="#c64600" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.85">
      <path d="M82 66 C 84 68, 85 70, 85 72"/>
      <path d="M81 80 C 83 82, 84 84, 84 86"/>
      <path d="M78 93 C 79 95, 80 96, 80 97"/>
    </g>
  </g>
</svg>
