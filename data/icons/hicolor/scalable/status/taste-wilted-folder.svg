<?xml version="1.0" encoding="UTF-8"?>
<!-- Empty-state illustration: a sad carrot beside an open, empty folder.
     Folder stays neutral gray; the carrot keeps its brand colors. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- folder back panel -->
  <path fill="#77767b" d="M14 42 a8 8 0 0 1 8 -8 h20 l8 9 h34 a8 8 0 0 1 8 8 v7 H14 Z"/>
  <!-- open front flap -->
  <path fill="#9a9996" d="M22 58 h74 a6 6 0 0 1 6 7 l-8 31 a10 10 0 0 1 -10 8 H22 a8 8 0 0 1 -8 -8 V66 a8 8 0 0 1 8 -8 Z"/>
  <!-- sad carrot, upright, leaning by the folder -->
  <g transform="translate(88 30) rotate(8)">
    <!-- leaves: drooping slightly, not dead — just sad -->
    <g fill="#26a269">
      <path d="M14 18 C 6 15, 0 16, -5 22 C 3 24, 9 22, 14 18 Z"/>
      <path d="M16 18 C 22 12, 30 10, 36 13 C 31 19, 23 21, 16 18 Z"/>
    </g>
    <path fill="#2ec27e" d="M15 19 C 12 12, 12 5, 16 -1 C 20 5, 19 13, 15 19 Z"/>
    <!-- body -->
    <path fill="#ff7800" d="M15 20 C 24 19, 31 24, 31 33 C 31 48, 25 66, 17 76 C 15 78, 12 78, 11 75 C 7 63, 5 46, 7 32 C 8 25, 11 21, 15 20 Z"/>
    <!-- sad face: two eyes and a frown -->
    <g fill="#7a3b00">
      <circle cx="14" cy="33" r="2.2"/>
      <circle cx="24" cy="33" r="2.2"/>
    </g>
    <path d="M13 44 C 16 41, 22 41, 25 44" stroke="#7a3b00" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
